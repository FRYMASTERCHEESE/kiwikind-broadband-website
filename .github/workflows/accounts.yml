name: Pages account and owner browser checks
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.cjs
      - run: node tests/broadband-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-synthetic-desktop-phone
          path: test-results/pages/*.png
          retention-days: 7
