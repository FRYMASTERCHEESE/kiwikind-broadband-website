name: Deploy KiwiKind Broadband website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage only approved public assets
        shell: bash
        run: |
          test -s index.html
          test ! -L index.html
          export_dir="$(mktemp -d "$RUNNER_TEMP/kiwikind-pages.XXXXXX")"
          cp index.html "$export_dir/index.html"
          for asset in privacy.html account-deletion.html policy.css; do
            test -s "$asset"
            test ! -L "$asset"
            cp "$asset" "$export_dir/$asset"
          done
          touch "$export_dir/.nojekyll"
          echo "PUBLIC_EXPORT_DIR=$export_dir" >> "$GITHUB_ENV"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PUBLIC_EXPORT_DIR }}
      - id: deployment
        uses: actions/deploy-pages@v4
