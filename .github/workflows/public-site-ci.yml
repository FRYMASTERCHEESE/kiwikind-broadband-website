name: Public KiwiKind website policy and safety checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public policy routes and no-sales gates
        run: node --test tests/*.test.cjs
